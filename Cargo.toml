[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gix = "0.90.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
devctl-platform = { path = "crates/devctl-platform" }
devctl-lcov = { path = "crates/devctl-lcov" }
devctl-junit = { path = "crates/devctl-junit" }
devctl-store = { path = "crates/devctl-store" }

[package]
name = "devctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
gix.workspace = true
devctl-platform.workspace = true
devctl-lcov.workspace = true
devctl-junit.workspace = true
devctl-store.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

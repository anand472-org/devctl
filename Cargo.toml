[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
redb = "4.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
regex = "1.13.1"
tracing = "0.1"
tempfile = "3.27.0"
fastrand = "2.4.1"
quick-xml = "0.42.0"
clap = { version = "4.6.7", features = ["derive"] }
gix = "0.90.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
devctl-platform = { path = "crates/devctl-platform" }
devctl-lcov = { path = "crates/devctl-lcov" }
devctl-junit = { path = "crates/devctl-junit" }
devctl-store = { path = "crates/devctl-store" }

[package]
name = "devctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
gix.workspace = true
regex.workspace = true
serde.workspace = true
toml.workspace = true
devctl-platform.workspace = true
devctl-lcov.workspace = true
devctl-junit.workspace = true
devctl-store.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

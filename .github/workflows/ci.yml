name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # Dev tools are pinned in mise.toml and mise.lock.
      - name: Install dev tools
        uses: jdx/mise-action@v3
        with:
          version: 2026.8.16
          install: true
          cache: true
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      # For the tests that build fixture git repositories.
      - name: Configure git identity
        run: git config --global user.name ci && git config --global user.email ci@example.invalid

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint, test and pure-Rust check
        run: just ci

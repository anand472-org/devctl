name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # Dev tools are pinned in .cargo/config.toml, so the cache key changes with them.
      # Restore and save are split so a fresh build is cached even if later steps fail.
      - name: Restore dev tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'rust-toolchain.toml') }}

      - name: Install dev tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: cargo install-just && cargo install-gix

      - name: Save dev tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - name: Add dev tools to PATH
        run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint, test and pure-Rust check
        run: just ci
